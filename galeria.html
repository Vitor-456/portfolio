		  				<!-- CARROSSEL DE IMAGENS -->
				<div class="carrossel-container">
					<div class="carrossel-slides" id="carrosselSlides">
						<div class="slide">
							<img src="leite_condensado/img/leite_condensado6.jpg" alt="leite condensado 6">
						</div>
						<div class="slide">
							<img src="leite_condensado/img/leite_condensado7.jpg" alt="leite condensado 7">
						</div>
						<div class="slide">
							<img src="leite_condensado/img/leite_condensado8.jpg" alt="leite condensado 8">
						</div>
					</div>

					<!-- Botões de navegação -->
					<button class="btn-carrossel btn-prev" onclick="mudarSlide(-1)">&#10094;</button>
					<button class="btn-carrossel btn-next" onclick="mudarSlide(1)">&#10095;</button>

					<!-- Indicadores (Bolinhas) -->
					<div class="carrossel-indicadores" id="carrosselIndicadores">
						<span class="indicador ativo" onclick="irParaSlide(0)"></span>
						<span class="indicador" onclick="irParaSlide(1)"></span>
						<span class="indicador" onclick="irParaSlide(2)"></span>
					</div>
				</div>
				
						<!-- Script JS para controle do carrossel -->
		<script>
			let indexAtual = 0;
			const slidesContainer = document.getElementById('carrosselSlides');
			const totalSlides = document.querySelectorAll('.slide').length;
			const indicadores = document.querySelectorAll('.indicador');
			let autoPlayTimer;

			function atualizarCarrossel() {
				slidesContainer.style.transform = `translateX(-${indexAtual * 100}%)`;
				indicadores.forEach((ind, i) => {
					ind.classList.toggle('ativo', i === indexAtual);
				});
			}

			function mudarSlide(direcao) {
				indexAtual = (indexAtual + direcao + totalSlides) % totalSlides;
				atualizarCarrossel();
				resetarAutoPlay();
			}

			function irParaSlide(index) {
				indexAtual = index;
				atualizarCarrossel();
				resetarAutoPlay();
			}

			function iniciarAutoPlay() {
				autoPlayTimer = setInterval(() => {
					mudarSlide(1);
				}, 4000); // Muda a cada 4 segundos
			}

			function resetarAutoPlay() {
				clearInterval(autoPlayTimer);
				iniciarAutoPlay();
			}

			// Inicia a transição automática
			iniciarAutoPlay();
		</script>
